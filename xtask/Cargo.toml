[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
facet = "0.46.5"
facet-json = "0.46.1"
flate2 = "1"
fontcull-font-types = "0.10"
fontcull-klippa = "0.1"
fontcull-read-fonts = { version = "0.38", features = ["experimental_traverse"] }
fontcull-skrifa = "0.39"
kurbo = "0.12"
rubify = { path = "..", default-features = false, features = ["pinyin", "romaji", "hiragana"] }
rustybuzz = "0.20"
tiny-skia = { version = "0.11", features = ["png-format"] }
