[package]
name = "rubify"
version = "0.1.0"
description = "Add ruby characters to fonts."
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lemueldls/rubify"

[workspace]
members = [".", "xtask"]

[features]
default = ["pinyin", "romaji", "hiragana", "woff2", "dict-ja", "dict-zh"]
pinyin = ["dep:pinyin"]
romaji = []
hiragana = []
woff2 = ["dep:woofwoof"]
# Bundle the compiled Japanese (furifont data) / Chinese (CC-CEDICT) word lists.
dict-ja = []
dict-zh = []

[dependencies]
anyhow = "1.0"
facet = { version = "0.46.5" }
facet-postcard = "0.46"
figue = { version = "4.0.5" }
flate2 = "1"
fontcull-font-types = "0.10"
fontcull-klippa = "0.1"
fontcull-read-fonts = { version = "0.38", features = ["experimental_traverse"] }
fontcull-skrifa = "0.39"
fontcull-write-fonts = "0.44"
glob = "0.3.3"
indicatif = { version = "0.18.4", features = ["rayon"] }
kurbo = "0.12"
pinyin = { version = "0.11.0", optional = true }
rayon = "1.11.0"
rustc-hash = "2.1.1"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
woofwoof = { version = "1.0", optional = true }

[dev-dependencies]
rustybuzz = "0.20"
ttf-parser = "0.25"

[[bench]]
name = "gsub"
harness = false
